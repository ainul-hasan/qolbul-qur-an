<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pengaturan - Qolbul Qur'an</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <div id="app" class="app-container">
        
        <header class="top-appbar">
            <div class="brand">
                <div class="brand-logo" style="background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);">
                    <i class="fas fa-cog"></i>
                </div>
                <div class="brand-text">
                    <h1>Pengaturan</h1>
                    <p>Sesuaikan aplikasi</p>
                </div>
            </div>
            <div class="appbar-actions">
                <button class="icon-btn" id="themeToggleTop" aria-label="Ganti Tema">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <div id="content" class="content-area">
            <div class="settings-container">
                <div class="setting-card">
                    <!-- TEMA -->
                    <div class="setting-group">
                        <h4><i class="fas fa-palette"></i> Tema</h4>
                        <div class="setting-item">
                            <span><i class="fas fa-moon" style="width:18px;"></i> Mode Gelap</span>
                            <div class="toggle" id="themeToggle"></div>
                        </div>
                    </div>

                    <!-- TAMPILAN -->
                    <div class="setting-group">
                        <h4><i class="fas fa-eye"></i> Tampilan</h4>
                        <div class="setting-item">
                            <div class="toggle-label" id="toggleLatinLabel">
                                <span><i class="fas fa-language" style="width:18px;"></i> Tampilkan Latin</span>
                                <div class="toggle-sm active" id="toggleLatin"></div>
                            </div>
                        </div>
                        <div class="setting-item">
                            <div class="toggle-label" id="toggleTranslationLabel">
                                <span><i class="fas fa-align-left" style="width:18px;"></i> Tampilkan Terjemahan</span>
                                <div class="toggle-sm active" id="toggleTranslation"></div>
                            </div>
                        </div>
                    </div>

                    <!-- UKURAN TEKS -->
                    <div class="setting-group">
                        <h4><i class="fas fa-text-height"></i> Ukuran Teks</h4>
                        <div class="text-size-buttons">
                            <button class="text-size-btn" data-size="small">
                                <span class="size-icon" style="font-size:12px;">A</span>
                                <span class="size-label">Kecil</span>
                            </button>
                            <button class="text-size-btn active" data-size="medium">
                                <span class="size-icon" style="font-size:16px;">A</span>
                                <span class="size-label">Sedang</span>
                            </button>
                            <button class="text-size-btn" data-size="large">
                                <span class="size-icon" style="font-size:20px;">A</span>
                                <span class="size-label">Besar</span>
                            </button>
                            <button class="text-size-btn" data-size="xlarge">
                                <span class="size-icon" style="font-size:24px;">A</span>
                                <span class="size-label">Ekstra</span>
                            </button>
                        </div>
                    </div>

                    <!-- DATA -->
                    <div class="setting-group">
                        <h4><i class="fas fa-database"></i> Data</h4>
                        <div class="setting-item">
                            <span><i class="fas fa-heart" style="width:18px;color:#ef4444;"></i> Reset Favorit</span>
                            <button class="danger" id="resetFav">Reset</button>
                        </div>
                        <div class="setting-item">
                            <span><i class="fas fa-check-circle" style="width:18px;color:#d97706;"></i> Reset Selesai</span>
                            <button class="danger" id="resetDone">Reset</button>
                        </div>
                        <div class="setting-item">
                            <span><i class="fas fa-trash-alt" style="width:18px;color:#ef4444;"></i> Reset Semua Data</span>
                            <button class="danger" id="resetAll">Reset Semua</button>
                        </div>
                    </div>

                    <!-- INFORMASI -->
                    <div class="setting-group">
                        <h4><i class="fas fa-info-circle"></i> Informasi</h4>
                        <div class="setting-item">
                            <span><i class="fas fa-code-branch" style="width:18px;"></i> Versi</span>
                            <span style="font-weight:700;color:var(--primary);">1.0.0</span>
                        </div>
                        <div class="setting-item">
                            <span><i class="fas fa-book-quran" style="width:18px;"></i> Total Bacaan</span>
                            <span style="font-weight:700;color:var(--primary);" id="totalBacaan">0</span>
                        </div>
                        <div class="setting-item">
                            <span><i class="fas fa-mosque" style="width:18px;"></i> Qolbul Qur'an</span>
                            <span>✨</span>
                        </div>
                    </div>

                    <div class="version">© 2026 Qolbul Qur'an · Ainul Hasan</div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
            <a href="semua.html" class="nav-item"><i class="fas fa-book-open"></i><span>Semua</span></a>
            <a href="favorid.html" class="nav-item"><i class="fas fa-heart"></i><span>Favorit</span></a>
            <a href="selesai.html" class="nav-item"><i class="fas fa-check-circle"></i><span>Selesai</span></a>
            <a href="pengaturan.html" class="nav-item active"><i class="fas fa-cog"></i><span>Atur</span></a>
        </nav>
    </div>

    <script src="../js/data.js"></script>
    <script>
        var data = window.READINGS_DATA || [];
        document.getElementById('totalBacaan').textContent = data.length;

        function applyVisibility() {
            var showLatin = localStorage.getItem('showLatin') !== 'false';
            var showTranslation = localStorage.getItem('showTranslation') !== 'false';
            
            if (!showLatin) document.body.classList.add('hide-latin');
            else document.body.classList.remove('hide-latin');
            
            if (!showTranslation) document.body.classList.add('hide-translation');
            else document.body.classList.remove('hide-translation');
        }

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
                document.getElementById('themeToggle').classList.add('active');
            }
        }

        function toggleTheme() {
            var isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggle').classList.toggle('active');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            var themeToggleTop = document.getElementById('themeToggleTop');
            var isDark = document.body.classList.contains('dark');
            themeToggleTop.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }

        initTheme();
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // Top AppBar Toggle
        document.getElementById('themeToggleTop').addEventListener('click', toggleTheme);

        // Toggle Latin
        var toggleLatin = document.getElementById('toggleLatin');
        var showLatin = localStorage.getItem('showLatin') !== 'false';
        if (showLatin) toggleLatin.classList.add('active');
        
        toggleLatin.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            var show = this.classList.contains('active');
            localStorage.setItem('showLatin', show ? 'true' : 'false');
            applyVisibility();
        });
        document.getElementById('toggleLatinLabel').addEventListener('click', function() { toggleLatin.click(); });

        // Toggle Translation
        var toggleTranslation = document.getElementById('toggleTranslation');
        var showTranslation = localStorage.getItem('showTranslation') !== 'false';
        if (showTranslation) toggleTranslation.classList.add('active');
        
        toggleTranslation.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            var show = this.classList.contains('active');
            localStorage.setItem('showTranslation', show ? 'true' : 'false');
            applyVisibility();
        });
        document.getElementById('toggleTranslationLabel').addEventListener('click', function() { toggleTranslation.click(); });

        // Text size
        function setTextSize(size) {
            document.body.classList.remove('text-small', 'text-medium', 'text-large', 'text-xlarge');
            if (size !== 'medium') document.body.classList.add('text-' + size);
            localStorage.setItem('textSize', size);
        }
        function initTextSize() {
            var saved = localStorage.getItem('textSize') || 'medium';
            setTextSize(saved);
            document.querySelectorAll('.text-size-btn').forEach(function(btn) {
                btn.classList.remove('active');
                if (btn.dataset.size === saved) btn.classList.add('active');
            });
        }
        initTextSize();
        document.querySelectorAll('.text-size-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var size = this.dataset.size;
                setTextSize(size);
                document.querySelectorAll('.text-size-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
            });
        });

        // Reset
        function resetData(key, message) {
            if (confirm(message)) {
                localStorage.setItem(key, '[]');
                alert('Data berhasil direset!');
            }
        }
        document.getElementById('resetFav').addEventListener('click', function() { resetData('favorit', 'Hapus semua favorit?'); });
        document.getElementById('resetDone').addEventListener('click', function() { resetData('selesai', 'Hapus semua data selesai?'); });
        document.getElementById('resetAll').addEventListener('click', function() {
            if (confirm('Reset semua data (favorit & selesai)?')) {
                localStorage.setItem('favorit', '[]');
                localStorage.setItem('selesai', '[]');
                alert('Semua data berhasil direset!');
            }
        });

        applyVisibility();
        updateThemeIcon();

        window.addEventListener('popstate', function() {
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        });
        history.pushState(null, '', window.location.href);
    </script>
</body>
</html>
